    <!--
      Identity, stated in the one format search engines parse rather than infer.

      `sameAs` is the part that matters for a name query: it is what lets Google
      collapse this page, the GitHub account, the LinkedIn profile and the Medium
      byline into a single entity instead of four unrelated documents that happen
      to share a name. Nothing else on the page can assert that.

      Everything here is already stated in visible copy on the site — inventing
      structured data the page does not back up is what gets rich results
      revoked.

      On the CSP: `script-src 'self'` does not block this. A <script> with a
      non-JavaScript `type` is a data block, never executed, so it is not
      subject to script-src at all. This does not reopen the inline-script hole
      the CSP was tightened to close.
    -->

    <!--
      Everything on this page is rendered by React, so the served HTML has an
      empty <body>. Googlebot does execute JavaScript, but it does so on a
      second pass that can lag the first crawl by days, and a single runtime
      error means it indexes nothing at all. Plenty of other crawlers — Bing's
      deeper passes, LinkedIn and Slack unfurlers, most SEO and AI crawlers —
      never render at all and would see a blank document.

      This is the same identity the page renders, in static markup, so there is
      no discrepancy between what a crawler reads and what a visitor sees. It
      is in <noscript> rather than inside #root because React clears its
      container on mount: content there would render and then be visibly
      thrown away on slow connections.

      The three hub pages are hand-written static HTML and are already fully
      crawlable without this.
    -->
