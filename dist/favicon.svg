<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NA">
  <!--
    Plain "NA" monogram — no tile, no container. Outlines, not <text>: an SVG
    favicon gets no webfont, and a system-font fallback would reflow the letters
    differently on every OS. These are Georgia Bold, condensed to 78% so two
    caps in a square box can scale up instead of shrinking to fit the width —
    at natural width they only reach 47% of the tile height and go illegible
    around 16px.

    This file is the source of truth. /assets/images/favicon.ico is the same
    outline rasterised at 16/32/48/64 for browsers that will not take an SVG
    icon; regenerate it from here if the mark ever changes.
  -->
  <!--
    ONE colour, no `prefers-color-scheme` switch. The first version flipped to
    cream in dark mode and came out invisible in practice — that query is only
    honoured on some of the surfaces an icon lands on (tab strip, bookmark bar,
    standalone view, the .ico consumers), so a mark that depends on it is
    invisible on whichever surface ignores it.

    #d6524a instead. A single colour cannot be high-contrast on both a light
    and a dark tab strip, but relative luminance ~0.21 maximises the WORST of
    the two: ~3.0:1 against #dddde0 AND ~3.0:1 against #202124, which clears
    the 3:1 bar for non-text contrast either way. The brand oxblood #7a2e2e
    sits at 0.046 — 7.5:1 on light, 1.5:1 on dark, hence the disappearing act.
    Checked by eye at 16/24/32px on light, dark and white before settling.
  -->
